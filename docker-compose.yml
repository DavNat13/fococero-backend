services:
  # ==========================================
  # 🗄️ BASE DE DATOS (POSTGRESQL + POSTGIS)
  # ==========================================
  db-fococero:
    image: postgis/postgis:15-3.3
    container_name: fococero-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES}
    ports:
      - "${DB_PORT_EXTERNAL}:5432"
    volumes:
      - fococero_pgdata:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh
      - ./ms-auth/init.sql:/docker-entrypoint-initdb.d/01-init-auth.sql
      - ./ms-geo/database/init.sql:/docker-entrypoint-initdb.d/02-init-geo.sql
      - ./ms-alertas/database/init.sql:/docker-entrypoint-initdb.d/03-init-alertas.sql
      - ./ms-reportes/database/init.sql:/docker-entrypoint-initdb.d/04-init-reportes.sql
      - ./ms-multimedia/database/init.sql:/docker-entrypoint-initdb.d/05-init-multimedia.sql
      - ./ms-emergencias/database/init.sql:/docker-entrypoint-initdb.d/06-init-emergencias.sql
      - ./ms-analitica/database/init.sql:/docker-entrypoint-initdb.d/07-init-analitica.sql
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fococero_admin -d fococero_default_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: fococero-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db-fococero:
        condition: service_healthy
    networks:
      - fococero-network

  # ==========================================
  # 🧠 CACHÉ Y BLOQUEOS (REDIS)
  # ==========================================
  redis-fococero:
    image: redis:7-alpine
    container_name: fococero-redis
    expose:
      - "6379"
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # 🌐 SERVICE DISCOVERY (EUREKA)
  # ==========================================
  eureka-server:
    image: steeltoeoss/eureka-server:latest
    container_name: fococero-eureka
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTERWITHEUREKA=false
      - EUREKA_CLIENT_FETCHREGISTRY=false
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/eureka/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ==========================================
  # 🚦 API GATEWAY
  # ==========================================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    env_file: ./api-gateway/.env
    depends_on:
      eureka-server:
        condition: service_healthy
      db-fococero:
        condition: service_healthy
      ms-auth:
        condition: service_started
      ms-geo:
        condition: service_started
      ms-alertas:
        condition: service_started
      ms-reportes:
        condition: service_started
    networks:
      - fococero-network

  # ==========================================
  # 🧱 MICROSERVICIOS (Red Interna Privada)
  # ==========================================
  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    restart: on-failure
    expose:
      - "3001"
    env_file: ./ms-auth/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network

  ms-analitica:
    build: ./ms-analitica
    container_name: ms-analitica
    restart: on-failure
    expose:
      - "3007"
    env_file: ./ms-analitica/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      redis-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network

  ms-geo:
    build: ./ms-geo
    container_name: ms-geo
    restart: on-failure
    expose:
      - "3002"
    env_file: ./ms-geo/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network

  ms-alertas:
    build: ./ms-alertas
    container_name: ms-alertas
    restart: on-failure
    expose:
      - "3003"
    env_file: ./ms-alertas/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network

  ms-reportes:
    build: ./ms-reportes
    container_name: ms-reportes
    restart: on-failure
    expose:
      - "3004"
    env_file: ./ms-reportes/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network

  ms-multimedia:
    build: ./ms-multimedia
    container_name: ms-multimedia
    restart: on-failure
    expose:
      - "3005"
    env_file: ./ms-multimedia/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network

  ms-emergencias:
    build: ./ms-emergencias
    container_name: ms-emergencias
    restart: on-failure
    expose:
      - "3006"
    env_file: ./ms-emergencias/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network

# ==========================================
# 💾 VOLUMEN Y RED
# ==========================================
volumes:
  fococero_pgdata:
    name: fococero_pgdata

networks:
  fococero-network:
    name: fococero-network
    driver: bridge