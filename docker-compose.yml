    env_file: ./ms-alertas/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ms-reportes:
    build: ./ms-reportes
    container_name: ms-reportes
    restart: unless-stopped
    init: true
    expose:
      - "3004"
    env_file: ./ms-reportes/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ms-multimedia:
    build: ./ms-multimedia
    container_name: ms-multimedia
    restart: unless-stopped
    init: true
    expose:
      - "3005"
    env_file: ./ms-multimedia/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
