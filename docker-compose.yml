services:
  # --- INFRAESTRUCTURA DE BASE DE DATOS (PostGIS) ---
  db-fococero:
    image: postgis/postgis:15-3.3
    container_name: fococero-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - fococero_pgdata:/var/lib/postgresql/data
      - ./ms-auth/init.sql:/docker-entrypoint-initdb.d/01-init-auth.sql
      - ./ms-geo/database/init.sql:/docker-entrypoint-initdb.d/02-init-geo.sql
      - ./ms-alertas/database/init.sql:/docker-entrypoint-initdb.d/03-init-alertas.sql
      - ./ms-reportes/database/init.sql:/docker-entrypoint-initdb.d/04-init-reportes.sql
    restart: always
    networks:
      - fococero-network

  # --- EL DIRECTOR: API GATEWAY ---
  api-gateway:
    build: ./api-gateway
    container_name: fococero-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV}
      - AUTH_SERVICE_URL=http://ms-auth:3001
      - GEO_SERVICE_URL=http://ms-geo:3002
      - ALERTAS_SERVICE_URL=http://ms-alertas:3003
      - REPORTES_SERVICE_URL=http://ms-reportes:3004
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - ms-auth
    networks:
      - fococero-network

  # --- MICROSERVICIOS OPERATIVOS ---
  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3001
      - DB_HOST=db-fococero
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db-fococero
    networks:
      - fococero-network

  ms-geo:
    build: ./ms-geo
    container_name: ms-geo
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=db-fococero
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db-fococero
    networks:
      - fococero-network

  ms-alertas:
    build: ./ms-alertas
    container_name: ms-alertas
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=db-fococero
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db-fococero
    networks:
      - fococero-network

  ms-reportes:
    build: ./ms-reportes
    container_name: ms-reportes
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=db-fococero
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - JWT_SECRET=${JWT_SECRET} # ✅ Inyección explícita corregida
    depends_on:
      - db-fococero
    networks:
      - fococero-network

  # --- HERRAMIENTAS DE GESTIÓN ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: fococero-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fococero.cl}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-foco0-1234}
    ports:
      - "5050:80"
    depends_on:
      - db-fococero
    networks:
      - fococero-network

networks:
  fococero-network:
    driver: bridge

volumes:
  fococero_pgdata:
