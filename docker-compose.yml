# Docker Compose FocoCero - Arquitectura Final con API Gateway
services:
  # ==========================================
  # 🗄️ BASE DE DATOS Y GESTIÓN
  # ==========================================
  db-fococero:
    image: postgis/postgis:15-3.3
    container_name: fococero-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432" # Expuesto solo para desarrollo/debug local
    volumes:
      - fococero_pgdata:/var/lib/postgresql/data
      - ./ms-auth/init.sql:/docker-entrypoint-initdb.d/01-init-auth.sql
      - ./ms-geo/database/init.sql:/docker-entrypoint-initdb.d/02-init-geo.sql
      - ./ms-alertas/database/init.sql:/docker-entrypoint-initdb.d/03-init-alertas.sql
      - ./ms-reportes/database/init.sql:/docker-entrypoint-initdb.d/04-init-reportes.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - fococero-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: fococero-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db-fococero:
        condition: service_healthy
    networks:
      - fococero-network

  # ==========================================
  # 🚦 API GATEWAY (Punto de Entrada Único)
  # ==========================================
  api-gateway:
    build: ./api-gateway
    container_name: fococero-gateway
    ports:
      - "3000:3000" # 🌍 ÚNICO PUERTO EXPUESTO AL FRONTEND
    env_file: ./api-gateway/.env
    depends_on:
      - ms-auth
      - ms-geo
      - ms-alertas
      - ms-reportes
    networks:
      - fococero-network

  # ==========================================
  # 🧱 MICROSERVICIOS (Red Interna Privada)
  # ==========================================
  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    expose:
      - "3001" # Solo accesible dentro de fococero-network
    env_file: ./ms-auth/.env
    depends_on:
      db-fococero:
        condition: service_healthy
    networks:
      - fococero-network

  ms-geo:
    build: ./ms-geo
    container_name: ms-geo
    expose:
      - "3002" # Solo accesible dentro de fococero-network
    env_file: ./ms-geo/.env
    depends_on:
      db-fococero:
        condition: service_healthy
    networks:
      - fococero-network

  ms-alertas:
    build: ./ms-alertas
    container_name: ms-alertas
    expose:
      - "3003" # Solo accesible dentro de fococero-network
    env_file: ./ms-alertas/.env
    depends_on:
      db-fococero:
        condition: service_healthy
    networks:
      - fococero-network

  ms-reportes:
    build: ./ms-reportes
    container_name: ms-reportes
    expose:
      - "3004" # Solo accesible dentro de fococero-network
    env_file: ./ms-reportes/.env
    depends_on:
      db-fococero:
        condition: service_healthy
    networks:
      - fococero-network

# ==========================================
# 💾 VOLUMEN Y RED
# ==========================================
volumes:
  fococero_pgdata:
    name: fococero_pgdata

networks:
  fococero-network:
    name: fococero-network
    driver: bridge
