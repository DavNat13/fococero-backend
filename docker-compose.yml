services:
  db-fococero:
    image: postgis/postgis:15-3.3
    container_name: fococero-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES}
    ports:
      - "${DB_PORT_EXTERNAL}:5432"
    volumes:
      - fococero_pgdata:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh
      - ./ms-auth/init.sql:/docker-entrypoint-initdb.d/01-init-auth.sql
      - ./ms-geo/database/init.sql:/docker-entrypoint-initdb.d/02-init-geo.sql
      - ./ms-alertas/database/init.sql:/docker-entrypoint-initdb.d/03-init-alertas.sql
      - ./ms-reportes/database/init.sql:/docker-entrypoint-initdb.d/04-init-reportes.sql
      - ./ms-multimedia/database/init.sql:/docker-entrypoint-initdb.d/05-init-multimedia.sql
      - ./ms-emergencias/database/init.sql:/docker-entrypoint-initdb.d/06-init-emergencias.sql
      - ./ms-analitica/database/init.sql:/docker-entrypoint-initdb.d/07-init-analitica.sql
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fococero_admin -d fococero_default_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4
    container_name: fococero-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - fococero_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db-fococero:
        condition: service_healthy
    networks:
      - fococero-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis-fococero:
    image: redis:7-alpine
    container_name: fococero-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - fococero_redis_data:/data
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  eureka-server:
    image: steeltoeoss/eureka-server:latest
    container_name: fococero-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTERWITHEUREKA=false
      - EUREKA_CLIENT_FETCHREGISTRY=false
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/eureka/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    env_file: ./api-gateway/.env
    depends_on:
      eureka-server:
        condition: service_healthy
      db-fococero:
        condition: service_healthy
      ms-auth:
        condition: service_healthy
      ms-geo:
        condition: service_healthy
      ms-alertas:
        condition: service_healthy
      ms-reportes:
        condition: service_healthy
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    restart: unless-stopped
    init: true
    expose:
      - "3001"
    env_file: ./ms-auth/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ms-analitica:
    build: ./ms-analitica
    container_name: ms-analitica
    restart: unless-stopped
    init: true
    expose:
      - "3007"
    env_file: ./ms-analitica/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      redis-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3007/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ms-geo:
    build: ./ms-geo
    container_name: ms-geo
    restart: unless-stopped
    init: true
    expose:
      - "3002"
    env_file: ./ms-geo/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ms-alertas:
