  ms-emergencias:
    build: ./ms-emergencias
    container_name: ms-emergencias
    restart: unless-stopped
    init: true
    expose:
      - "3006"
    env_file: ./ms-emergencias/.env
    depends_on:
      db-fococero:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fococero-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fococero_pgdata:
    name: fococero_pgdata
  fococero_redis_data:
    name: fococero_redis_data
  fococero_pgadmin_data:
    name: fococero_pgadmin_data

networks:
  fococero-network:
    name: fococero-network
    driver: bridge
