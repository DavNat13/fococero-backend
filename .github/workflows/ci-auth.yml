name: CI/CD Pipeline - ms-auth

on:
  push:
    branches: [ "main", "develop", "feature/ms-geo" ]
    paths:
      - 'ms-auth/**'
  pull_request:
    branches: [ "main", "develop" ]

# Forzamos al entorno a usar las versiones más modernas de JavaScript
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./ms-auth

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4 # 🔄 Actualizado de v3 a v4

    - name: Configurar Node.js 22
      uses: actions/setup-node@v4 # 🔄 Actualizado de v3 a v4
      with:
        node-version: '22' # 🚀 Subimos a la versión estable más moderna
        cache: 'npm'
        cache-dependency-path: './ms-auth/package-lock.json'

    - name: Instalar dependencias
      run: npm ci

    - name: Revisar estilo de código (Linter)
      run: npm run lint

    - name: Ejecutar pruebas (Jest)
      run: npm run test

    - name: Compilar TypeScript (Build)
      run: npm run build