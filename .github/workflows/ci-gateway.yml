name: CI/CD Pipeline - api-gateway

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "api-gateway/**"
  pull_request:
    branches: ["main", "develop"]
    paths: # Añadido para optimizar PRs
      - "api-gateway/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-gateway

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./api-gateway/package-lock.json"

      - name: Install
        run: npm ci

      # Comentado temporalmente hasta agregar script en package.json
      # - name: Lint
      #   run: npm run lint

      - name: Build
        run: npm run build
