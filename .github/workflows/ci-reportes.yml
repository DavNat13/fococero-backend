name: CI/CD Pipeline - ms-geo

on:
  push:
    branches: [ "main", "develop", "feature/ms-geo" ]
    paths:
      - 'ms-reportes/**'
  pull_request:
    branches: [ "main", "develop" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ms-geo

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './ms-reportes/package-lock.json'

    - name: Install
      run: npm ci

      # - name: Lint
      #   run: npm run lint

      # - name: Test
      #   run: npm run test

    - name: Build
      run: npm run build