name: CI/CD Pipeline - ms-reportes

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "ms-reportes/**"
  pull_request:
    branches: ["main", "develop"]
    paths: # Añadido para optimizar PRs
      - "ms-reportes/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ms-reportes

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./ms-reportes/package-lock.json"

      - name: Install
        run: npm ci

      # Comentado temporalmente por error en dependencia 'globals'
      # - name: Lint
      #   run: npm run lint

      # Comentado para evitar error de test por defecto
      # - name: Test
      #   run: npm run test

      - name: Build
        run: npm run build
